name: Build & Publish APK

on:
  push:
    tags:
      - 'v*'          # dispara em: git tag v1.0.0 && git push --tags

permissions:
  contents: write     # necessário para criar GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Android)
        run: npm run build
        env:
          VITE_BUILD_TARGET: android
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_ORS_API_KEY: ${{ secrets.VITE_ORS_API_KEY }}
          # Onde o APK pergunta com qual servidor falar. Precisa ser ABSOLUTA:
          # no aplicativo nativo o `fetch` relativo le' o arquivo empacotado.
          VITE_CONFIG_URL: ${{ secrets.VITE_CONFIG_URL }}

      - name: Capacitor sync
        run: npx cap sync android

      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Usando keystore salvo (KEYSTORE_BASE64)"
            node -e "require('fs').writeFileSync('android/cobeb-release.jks', Buffer.from(process.env.KEYSTORE_BASE64, 'base64'))"
          else
            echo "Gerando novo keystore e imprimindo base64 para salvar como secret..."
            keytool -genkeypair \
              -keystore android/cobeb-release.jks \
              -storetype PKCS12 \
              -storepass Cobeb2026Ciclo \
              -alias cobebciclo \
              -keypass Cobeb2026Ciclo \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=COBEB Ciclo de Carretas, OU=Transportes, O=COBEB, L=Brasil, ST=Brasil, C=BR"
            echo "::notice title=SALVE COMO SECRET KEYSTORE_BASE64::$(base64 -w 0 android/cobeb-release.jks)"
          fi

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ../cobeb-release.jks
          KEYSTORE_STORE_PASSWORD: Cobeb2026Ciclo
          KEYSTORE_KEY_ALIAS: cobebciclo
          KEYSTORE_KEY_PASSWORD: Cobeb2026Ciclo

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             cobeb-ciclo-${{ github.ref_name }}.apk

      - name: Create GitHub Release & upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "COBEB Ciclo ${{ github.ref_name }}"
          body: |
            ## COBEB Ciclo de Carretas ${{ github.ref_name }}

            Instale o APK no celular do motorista para rastreamento em background.

            **Como instalar:**
            1. Baixe o arquivo `cobeb-ciclo-${{ github.ref_name }}.apk`
            2. Se já tem o app instalado, instale por cima (sem desinstalar)
            3. Permita "Instalar de fontes desconhecidas" se solicitado
          files: cobeb-ciclo-${{ github.ref_name }}.apk
