name: Build & Publish APK

on:
  push:
    tags:
      - 'v*'          # dispara em: git tag v1.0.0 && git push --tags

permissions:
  contents: write     # necessário para criar GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web assets (Android)
        run: npm run build
        env:
          VITE_BUILD_TARGET: android
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # A SERVICE ROLE nao entra aqui. Ver o `supabaseAdmin.js` apagado
          # neste mesmo commit: variavel VITE_* vai INTEIRA para dentro do
          # arquivo que o motorista instala, e essa chave ignora o RLS.
          VITE_ORS_API_KEY: ${{ secrets.VITE_ORS_API_KEY }}
          # Onde o APK pergunta com qual servidor falar. Precisa ser ABSOLUTA:
          # no aplicativo nativo o `fetch` relativo le' o arquivo empacotado.
          VITE_CONFIG_URL: ${{ secrets.VITE_CONFIG_URL }}

      - name: Capacitor sync
        run: npx cap sync android

      # O keystore e' a IDENTIDADE do aplicativo: o Android so' aceita uma
      # atualizacao assinada com a mesma chave. Perde-la significa que nenhum
      # motorista consegue atualizar -- so' desinstalando e instalando de novo.
      #
      # Por isso NAO ha' plano B que fabrica uma chave nova. O que havia aqui
      # gerava um keystore e imprimia o base64 dele como `::notice::` -- e num
      # repositorio PUBLICO o log da execucao e' publico, entao a chave privada
      # de assinatura da COBEB seria publicada. Faltar o secret e' um problema
      # de configuracao: para a esteira e diz o que fazer.
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          faltando=""
          [ -z "$KEYSTORE_BASE64" ] && faltando="$faltando KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ] && faltando="$faltando KEYSTORE_PASSWORD"
          if [ -n "$faltando" ]; then
            echo "::error title=Falta secret::Sem$faltando o APK nao pode ser assinado com a chave da COBEB."
            echo "Cadastre em Settings > Secrets and variables > Actions." >&2
            echo "NAO gere um keystore novo: chave diferente = nenhum motorista" >&2
            echo "consegue atualizar o app instalado." >&2
            exit 1
          fi
          node -e "require('fs').writeFileSync('android/cobeb-release.jks', Buffer.from(process.env.KEYSTORE_BASE64, 'base64'))"
          echo "Keystore restaurado do secret."

      - name: Build signed APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          KEYSTORE_FILE: ../cobeb-release.jks
          # A senha vem do cofre. Escrita aqui, ela ficava legivel por qualquer
          # pessoa na internet (o repositorio e' publico) e no historico do git.
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'cobebciclo' }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk \
             cobeb-ciclo-${{ github.ref_name }}.apk

      - name: Create GitHub Release & upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: "COBEB Ciclo ${{ github.ref_name }}"
          body: |
            ## COBEB Ciclo de Carretas ${{ github.ref_name }}

            Instale o APK no celular do motorista para rastreamento em background.

            **Como instalar:**
            1. Baixe o arquivo `cobeb-ciclo-${{ github.ref_name }}.apk`
            2. Se já tem o app instalado, instale por cima (sem desinstalar)
            3. Permita "Instalar de fontes desconhecidas" se solicitado
          files: cobeb-ciclo-${{ github.ref_name }}.apk
