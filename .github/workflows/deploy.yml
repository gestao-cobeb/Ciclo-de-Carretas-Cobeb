name: Deploy to GitHub Pages

# Só quando o APP muda (22/11/2026, corte de minutos do Actions aprovado pelo
# Lucas: 120 deploys em novembro, a maioria por commit de documentação, SQL ou
# Android, que não mudam o site). Arquivo novo que entra no build? Acrescente.
# Para publicar na mão: Actions → Deploy to GitHub Pages → Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "patches/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "gerar-config.mjs"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # A SERVICE ROLE nao entra aqui -- ver o build-apk.yml e o
          # `supabaseAdmin.js` apagado neste mesmo commit.
          VITE_BASE_URL: /Ciclo-de-Carretas-Cobeb/
          VITE_APK_URL: ${{ secrets.VITE_APK_URL }}
          VITE_ORS_API_KEY: ${{ secrets.VITE_ORS_API_KEY }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - uses: actions/deploy-pages@v5
        id: deployment
