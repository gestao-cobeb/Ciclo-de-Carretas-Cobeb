server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx no cabeçalho e na página de erro.
    server_tokens off;

    # ⚠ ESTA LINHA É O QUE FAZ O SISTEMA FUNCIONAR AO RECARREGAR A PÁGINA.
    #
    # É o equivalente do `rewrites` do vercel.json. O roteamento é do
    # react-router, no navegador: o servidor não tem arquivo nenhum chamado
    # `/viagens` ou `/cadastros/motoristas`.
    #
    # Sem o fallback, a navegação por dentro do app funciona (o clique não passa
    # pelo servidor) e só o F5 -- ou o link colado, ou o favorito -- dá 404. Ou
    # seja: parece que subiu bem, e quebra na mão de quem recarrega.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # O index.html NUNCA é cacheado.
    #
    # Ele é quem aponta para os arquivos com hash no nome. Cacheado, o navegador
    # continua pedindo a versão ANTIGA depois do deploy -- e aí "eu publiquei e
    # continua igual" vira defeito de navegador, que é dos mais caros de achar.
    #
    # ⚠ Os três `add_header` de segurança estão REPETIDOS aqui e no bloco
    # /assets/ de propósito, e não é descuido: no nginx, um `add_header` dentro
    # de um `location` DESCARTA todos os herdados do `server`. Sem a repetição,
    # o index.html -- o documento principal, justamente o que importa para o
    # `frame-ancestors` -- sairia sem nenhum deles, enquanto o `curl` num
    # caminho qualquer mostraria os três presentes.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        expires -1;
    }

    # Os arquivos que o Vite gera têm hash no nome (app-a1b2c3.js): nome novo a
    # cada mudança, então cachear para sempre é seguro e tira o peso da rede.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;

    # `frame-ancestors 'none'`: o painel não pode ser embutido em iframe de
    # outro site (clickjacking).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # O APK é grande e o navegador precisa saber que é download, não página.
    location ~* \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
    }
}
